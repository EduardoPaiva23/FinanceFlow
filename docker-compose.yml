services:
  db:
    image: postgres:16-alpine
    container_name: financeflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: financeflow
      POSTGRES_DB: financeflow
    ports:
      - "5432:5432"
    volumes:
      - financeflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  financeflow_pgdata:
